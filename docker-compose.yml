services:
  commanderdog:
    image: ghcr.io/woofson/commanderdog:latest
    container_name: commanderdog
    restart: unless-stopped
    ports:
      - "3140:3140"
    environment:
      - TZ=UTC
      - CD_PORT=3140
      - CD_BIND=0.0.0.0
      - CD_DATABASE_PATH=/data/commanderdog.db
    volumes:
      # Data & Configuration persistence (database, runtime state, custom configs)
      - ./data:/data
      
      # Host Storage / Shares (Mount host directories to manage)
      - /home:/mnt/home:rw
      - /mnt/storage:/mnt/storage:rw
      - /media:/mnt/media:rw
      
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3140/api/system/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    
    security_opt:
      - no-new-privileges:true
