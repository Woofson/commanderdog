Description: |
  CommanderDog is a blazing-fast orthodox multi-tab file commander for Windows and Linux.
  Features 1-to-4 toggleable panes, DeltaCopy bit-for-bit file verification, transparent
  encrypted vaults (AES-256-GCM / Argon2id), multi-cloud remotes (SMB, SFTP, S3, WebDAV),
  dockable EditorDog power editor, and native desktop integration with system tray.
