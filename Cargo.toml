[package]
name = "commanderdog"
version = "0.3.0"
edition = "2021"
authors = ["Bolt J Woofson <bolt@boop.no>"]
description = "Multi-Tab Web Commander - By Woofson"
license = "MIT"

[dependencies]
open = "5.3"
filetime = "0.2"
crc32fast = "1.4"
futures-util = "0.3"
portable-pty = "0.8"
dirs = "5.0"
axum = { version = "0.7", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
argon2 = "0.5"
jsonwebtoken = "9.3"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
similar = { version = "2.6", features = ["inline", "bytes"] }
zip = { version = "2.2", default-features = false, features = ["deflate", "bzip2", "time"] }
tar = "0.4"
flate2 = "1.0"
bzip2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ssh2 = "0.9"
tempfile = "3.16"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.12", features = ["v4", "serde"] }
parking_lot = "0.12"
async-trait = "0.1"
base64 = "0.22"
hmac = "0.12"
pam-auth = { version = "0.5", optional = true }
regex = "1.11"

[features]
default = ["pam"]
pam = ["dep:pam-auth"]

[package.metadata.deb]
maintainer = "Bolt J Woofson <bolt@boop.no>"
copyright = "2026, Bolt J Woofson <bolt@boop.no>"
license-file = ["LICENSE", "4"]
extended-description = """\
Multi-Tab Web Commander blending the orthodox speed of Total Commander / \
Midnight Commander with the modern responsiveness of Next Explorer. Features \
1-to-4 toggleable panes, WebDAV/SFTP, S3 Cloud Storage, DeltaCopy/TeraCopy \
engine, floating multi-tab power editor with Markdown & Mermaid, slide-up web terminal, \
directory sync, and 11 customizable themes."""
section = "utils"
priority = "optional"
depends = "$auto, ca-certificates, libsqlite3-0, libssh2-1, tar, bzip2, p7zip-full"
assets = [
    ["target/release/commanderdog", "usr/local/bin/commanderdog", "755"],
    ["commanderdog.service", "lib/systemd/system/commanderdog.service", "644"],
    ["conf.d/00-server.toml", "etc/commanderdog/conf.d/00-server.toml", "644"],
    ["conf.d/10-auth.toml", "etc/commanderdog/conf.d/10-auth.toml", "644"],
    ["conf.d/20-themes.toml", "etc/commanderdog/conf.d/20-themes.toml", "644"],
    ["conf.d/30-actions.toml", "etc/commanderdog/conf.d/30-actions.toml", "644"],
    ["assets/commanderdog.png", "usr/share/pixmaps/commanderdog.png", "644"],
    ["README.md", "usr/share/doc/commanderdog/README.md", "644"],
]
