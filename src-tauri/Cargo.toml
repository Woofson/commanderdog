[package]
name = "commanderdog-desktop"
version = "0.3.0"
description = "CommanderDog Native Desktop App - Multi-Tab Web Commander"
authors = ["Bolt J Woofson <bolt@boop.no>"]
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
open = "5.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
