[desktop]
# Minimize CommanderDog window to system tray when closed instead of exiting
minimize_to_tray = true

# Enable system tray icon
enable_tray = true

# Global system-wide summon/toggle hotkey
# Formats: "Super+C", "Ctrl+Alt+Space", "Ctrl+Shift+C", "Alt+Space"
global_summon_hotkey = "Super+C"

# Start application minimized in system tray on system boot / login
start_minimized = false
