# CommanderDog Paranoid Mode & Context Menu Script Actions
[paranoid]
enabled = true
checksum_algorithm = "sha256"
verify_after_transfer = true
atomic_writes = true
trash_enabled = true
confirm_delete = true
confirm_overwrite = true

[[custom_actions]]
id = "sha256-calc"
label = "Calculate SHA-256 Checksum"
icon = "shield-check"
command = "builtin:checksum:sha256"
applicable_to = "file"
in_background = false

[[custom_actions]]
id = "folder-diff"
label = "Compare with Other Pane (Diff)"
icon = "columns-2"
command = "builtin:diff"
applicable_to = "all"
in_background = false

[[custom_actions]]
id = "compress-zip"
label = "Compress to .zip"
icon = "archive"
command = "builtin:archive:zip"
applicable_to = "all"
in_background = true

[[custom_actions]]
id = "compress-targz"
label = "Compress to .tar.gz"
icon = "archive"
command = "builtin:archive:targz"
applicable_to = "all"
in_background = true

[[custom_actions]]
id = "extract-here"
label = "Extract Archive Here"
icon = "unarchive"
command = "builtin:archive:extract"
applicable_to = "archive"
in_background = true
