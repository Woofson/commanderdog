# CommanderDog Core Server Configuration
[server]
host = "0.0.0.0"
port = 8080
root_path = "/"
upload_max_size_mb = 10240
enable_auth = true
session_duration_hours = 72
database_path = "commanderdog.db"

[ui]
default_pane_count = 2
default_layout = "dual-vertical" # Options: single, dual-vertical, dual-horizontal, triple, quad
show_hidden_files = true
default_view_mode = "details"    # Options: details, compact, grid
