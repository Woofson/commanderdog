[ui]
# Default pane count on startup (1 to 4)
default_pane_count = 2

# Default layout: "quad", "dual-vertical", "dual-horizontal", "single", "triple"
default_layout = "dual-vertical"

# Show hidden / dotfiles by default
show_hidden_files = true

# Default file view mode: "details", "compact", "grid"
default_view_mode = "details"

# Native Desktop Window Decorations (Title bar & window borders)
# Set to false for borderless/frameless mode in tiling window managers (Hyprland, Sway, i3, BSPWM)
window_decorations = true
